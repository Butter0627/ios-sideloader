name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Setup Rust for iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build Rust Core (aarch64-apple-ios)
        working-directory: rust-core
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        run: cargo build --release --target aarch64-apple-ios

      - name: Create XCFramework
        run: |
          rm -rf ios/Frameworks/SideloaderCore.xcframework
          xcodebuild -create-xcframework \
            -library rust-core/target/aarch64-apple-ios/release/libsideloader_core.a \
            -headers rust-core/include \
            -output ios/Frameworks/SideloaderCore.xcframework

      - name: Generate Xcode Project & Build Unsigned IPA
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild \
            -project Sideloader.xcodeproj \
            -scheme Sideloader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            BUILD_DIR="$PWD/build" \
            clean build
          rm -rf Payload Sideloader-unsigned.ipa
          mkdir -p Payload
          cp -R build/Release-iphoneos/Sideloader.app Payload/
          zip -qry Sideloader-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sideloader-unsigned-ipa
          path: ios/Sideloader-unsigned.ipa
